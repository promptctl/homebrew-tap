# Moves Casks/vhid.rb to vhid's newest release. What it does is promptctl/vhid's
# .github/workflows/cask.yaml, beside the script it runs; this file gives it the write to
# this tap, through this tap's own token. vhid's release.yaml starts it once a release is
# published, and `gh workflow run vhid.yaml` starts it by hand (vhid's docs/releasing.md);
# nothing else does.
name: vhid

on:
  workflow_dispatch:

permissions:
  contents: write

# One move at a time: a run that starts behind another waits, and finds the cask moved.
concurrency:
  group: vhid

jobs:
  cask:
    uses: promptctl/vhid/.github/workflows/cask.yaml@master
